# Публікація застосунку на GitHub Pages.
#
# Збирати нічого не треба — це статичні файли без залежностей, тому
# викладаємо репозиторій як є. Тести ганяємо перед публікацією: якщо
# зламалася формула, застосунок не поїде на телефон.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Робоча гілка тут тимчасово, щоб застосунок опублікувався ще до злиття
      # в main. Після злиття цей рядок можна прибрати.
      - claude/cloud-code-mobile-97ngmn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Перевірити розрахункове ядро
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
