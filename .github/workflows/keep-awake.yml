# Не даємо базі заснути.
#
# Безкоштовний план Supabase присипляє проєкт після 7 днів без звернень.
# Для команди це дрібниця, а для клієнта, який зайшов уперше за тиждень, —
# застосунок «не працює» цілу хвилину, поки база прокидається.
#
# Раз на добу тихо смикаємо відкритий службовий запит. Це звичайне звернення
# до застосунку, ніяких хитрощів: сон рахується від останньої активності.

name: Keep database awake

on:
  schedule:
    # Щодня о 04:17 UTC. Некругла хвилина навмисно: о рівній годині черга
    # запусків у GitHub найдовша, і завдання може зсунутись на десятки хвилин.
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Розбудити базу
        env:
          SUPABASE_URL: https://whbxhdnbydjibkqtispm.supabase.co
          SUPABASE_KEY: sb_publishable_CVilEBXkRbLGd4o6q89gKg_YgPSfEjk
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_KEY")
          echo "Відповідь: $code"
          # 200 — база жива. Інше не валимо: прокидання може тривати довше,
          # ніж чекає curl, а сам факт звернення вже скидає лічильник сну.
          if [ "$code" != "200" ]; then
            echo "База відповіла не одразу — це нормально після сну."
          fi
