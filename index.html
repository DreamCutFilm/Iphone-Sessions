<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover — щоб інтерфейс заходив під «чубчик» і смугу Home на iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>DreamCut App</title>
  <meta name="description" content="Робочий інструмент оператора: проєкти, дедлайни, задачі, ідеї та кінорозрахунки. Працює офлайн.">

  <!-- Повноекранний режим після додавання на екран «Додому» -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DreamCut App">
  <meta name="theme-color" content="#0b0c0e">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <main id="screen" class="screen" role="main"></main>
  <nav id="tabbar" class="tabbar" role="navigation" aria-label="Розділи"></nav>

  <noscript>
    <p style="padding:2rem;color:#f2f3f5;background:#0b0c0e">
      Для роботи застосунку потрібен увімкнений JavaScript.
    </p>
  </noscript>

  <script type="module" src="src/app.js"></script>
</body>
</html>
